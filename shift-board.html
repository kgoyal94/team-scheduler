/* ------------------------------------------------------------------ */
/* Date + time helpers                                                 */
/* ------------------------------------------------------------------ */
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const dowOf = (iso) => (new Date(iso + "T12:00:00").getDay() + 6) % 7; // 0 = Monday
const mondayOf = (iso) => addDays(iso, -dowOf(iso));
const fmtDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
const fmtMonth = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "long", year: "numeric" });
const addMonths = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(1); d.setMonth(d.getMonth() + n); return d.toISOString().slice(0, 10); };
const monthOfISO = (iso) => iso.slice(0, 7);
const fmtTime = (min) => { const h24 = Math.floor(min/60), m = min%60, h = ((h24+11)%12)+1; return `${h}:${String(m).padStart(2,"0")}${h24<12?"a":"p"}`; };
const plainTime = (min) => { const h24 = Math.floor(min/60), m = min%60, h = ((h24+11)%12)+1; return `${h}:${String(m).padStart(2,"0")}`; };
const TIME_OPTIONS = [];
for (let m = 300; m <= 1410; m += 30) TIME_OPTIONS.push(m);

const todayISO = () => new Date().toISOString().slice(0, 10);

/* ------------------------------------------------------------------ */
/* Rules engine                                                        */
/* ------------------------------------------------------------------ */
const onTimeOff = (emp, dateISO) => emp.timeOff.find((t) => dateISO >= t.start && dateISO <= t.end);
const trainedFor = (emp, type) =>
  type === "open" ? emp.canOpen : type === "close" ? emp.canClose : type === "full" ? emp.canOpen && emp.canClose : true;
const trainingLabel = (type) => (type === "full" ? "open and close" : type === "open" ? "open" : "close");
const hoursFor = (shifts, empId, weekDates) =>
  shifts.filter((s) => s.empId === empId && weekDates.includes(s.date))
        .reduce((sum, s) => sum + (s.end - s.start) / 60, 0);

// What a training shift teaches, based on its times vs the day's store hours
function trainingCovers(shift, settings) {
  const d = settings.days[dowOf(shift.date)];
  const openStart = d.storeOpen - settings.prepMinutes;
  const closeEnd = d.storeClose + d.closeOut;
  return { open: shift.start <= openStart + 15, close: shift.end >= closeEnd - 15 };
}
function trainingFocusLabel(shift, settings) {
  const c = trainingCovers(shift, settings);
  if (c.open && c.close) return "open + close";
  if (c.open) return "opening";
  if (c.close) return "closing";
  return "swing";
}

function rankCandidates({ employees, shifts, dateISO, type, weekDates, tmpl, settings }) {
  const dow = weekDates.indexOf(dateISO);
  const shiftHrs = (tmpl.end - tmpl.start) / 60;
  const isTraining = type === "training";
  const focus = isTraining ? trainingCovers({ date: dateISO, start: tmpl.start, end: tmpl.end }, settings) : null;
  const qualified = [];
  const excluded = [];
  employees.forEach((emp) => {
    const off = onTimeOff(emp, dateISO);
    if (off) { excluded.push({ emp, why: `Requested off (${off.note || "time off"})` }); return; }
    if (!emp.availability[dow]) { excluded.push({ emp, why: `Not available on ${DAY_NAMES[dow]}s` }); return; }
    if (!isTraining && !trainedFor(emp, type)) { excluded.push({ emp, why: `Not trained to ${trainingLabel(type)}` }); return; }
    if (shifts.some((s) => s.empId === emp.id && s.date === dateISO)) {
      excluded.push({ emp, why: "Already scheduled this day" }); return;
    }
    const hrs = hoursFor(shifts, emp.id, weekDates);
    if (hrs + shiftHrs > emp.maxHours + 0.01) {
      excluded.push({ emp, why: `Would go over their ${emp.maxHours}h weekly max (at ${hrs.toFixed(1)}h)` }); return;
    }
    const reasons = [];
    let score;
    if (isTraining) {
      const needsOpen = focus.open && !emp.canOpen;
      const needsClose = focus.close && !emp.canClose;
      score = emp.flex * 3 + (needsOpen ? 6 : 0) + (needsClose ? 6 : 0);
      if (needsOpen || needsClose)
        reasons.push(`Not yet certified to ${[needsOpen && "open", needsClose && "close"].filter(Boolean).join(" & ")} — this trains them`);
      else reasons.push("Already certified — refresher shadow shift");
      reasons.push(`Flexibility ${emp.flex}/3`);
    } else {
      const deficit = Math.max(0, emp.minHours - hrs);
      const headroom = emp.maxHours - (hrs + shiftHrs);
      score = deficit * 2 + emp.flex * 3 + Math.min(headroom, 10) * 0.3;
      if (deficit > 0) reasons.push(`${deficit.toFixed(1)}h under their ${emp.minHours}h minimum`);
      else reasons.push(`Minimum already met (${hrs.toFixed(1)}h)`);
      reasons.push(`Flexibility ${emp.flex}/3`);
      reasons.push(`${headroom.toFixed(1)}h of room under their ${emp.maxHours}h max`);
      if (type !== "swing") reasons.push(`Trained to ${trainingLabel(type)}`);
    }
    qualified.push({ emp, score, reasons });
  });
  qualified.sort((a, b) => b.score - a.score);
  return { qualified, excluded };
}

function shiftIssues(shift, emp) {
  const issues = [];
  if (!emp) return ["Unknown employee"];
  const off = onTimeOff(emp, shift.date);
  if (off) issues.push(`${emp.name} requested this day off`);
  const dow = dowOf(shift.date);
  if (!emp.availability[dow]) issues.push(`${emp.name} is unavailable on ${DAY_NAMES[dow]}s`);
  if (shift.type !== "training" && !trainedFor(emp, shift.type))
    issues.push(`${emp.name} isn't trained to ${trainingLabel(shift.type)}`);
  return issues;
}

/* ------------------------------------------------------------------ */
/* Export — two-tab styled .xlsx (opens in Google Sheets with tabs)    */
/* ------------------------------------------------------------------ */
const HEX = (c) => (c || "").replace("#", "").toUpperCase();
const thinBorder = () => {
  const s = { style: "thin", color: { rgb: "CDD3CB" } };
  return { top: s, bottom: s, left: s, right: s };
};
const shiftText = (s) => {
  const t = SHIFT_TYPES[s.type];
  if (s.type === "swing") return `SWING ${plainTime(s.start)} to ${plainTime(s.end)}`;
  if (s.type === "training") return `TRAINING ${plainTime(s.start)} to ${plainTime(s.end)}`;
  if (s.type === "full") return `${plainTime(s.start)} to ${plainTime(s.end)} (open+close)`;
  return `${plainTime(s.start)} to ${plainTime(s.end)}`;
};
const cellFillFor = (type) =>
  type === "open" ? "FBF1DC" : type === "swing" ? "E4EEF6" : type === "close" ? "EAE6F3"
  : type === "full" ? "F3E9DA" : type === "training" ? "E1F1EC" : "FFFFFF";

function buildWorkbook({ employees, shifts, settings, weekStart, monthAnchor }) {
  const XLSX = window.XLSX;
  const wb = XLSX.utils.book_new();
  const weekDates = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));

  /* ---------- WEEK sheet (matches the uploaded spreadsheet shape) ---------- */
  const headFill = { patternType: "solid", fgColor: { rgb: "2C332E" } };
  const headFont = { bold: true, color: { rgb: "FFFFFF" }, sz: 11 };
  const wsWeekAoa = [];
  const styleMap = {}; // "r,c" -> style

  const put = (r, c, v, style) => {
    while (wsWeekAoa.length <= r) wsWeekAoa.push([]);
    wsWeekAoa[r][c] = v;
    if (style) styleMap[`${r},${c}`] = style;
  };

  const headerCols = ["", "Phone number", ...DAY_NAMES.map((d, i) => `${d.toUpperCase()}  ${fmtDate(weekDates[i])}`), "TIME OFF REQUESTS"];
  headerCols.forEach((h, c) => put(0, c, h, { fill: headFill, font: headFont, alignment: { horizontal: "center", vertical: "center", wrapText: true }, border: thinBorder() }));

  employees.forEach((emp, idx) => {
    const r = idx + 1;
    put(r, 0, emp.name, { font: { bold: true }, border: thinBorder(), alignment: { vertical: "center" } });
    put(r, 1, emp.phone, { border: thinBorder(), alignment: { vertical: "center" }, font: { sz: 10, color: { rgb: "5B675F" } } });
    weekDates.forEach((date, di) => {
      const ds = shifts.filter((s) => s.empId === emp.id && s.date === date).sort((a, b) => a.start - b.start);
      let val = "", fill = "FFFFFF";
      if (ds.length) {
        val = ds.map(shiftText).join("\n");
        fill = cellFillFor(ds[0].type);
      } else if (onTimeOff(emp, date)) {
        val = "req off"; fill = "EFEAF7";
      }
      put(r, 2 + di, val, {
        fill: { patternType: "solid", fgColor: { rgb: fill } },
        alignment: { horizontal: "center", vertical: "center", wrapText: true },
        border: thinBorder(), font: { sz: 10 },
      });
    });
    const notes = emp.timeOff.map((t) =>
      (t.start === t.end ? fmtDate(t.start) : `${fmtDate(t.start)}–${fmtDate(t.end)}`) + (t.note ? ` (${t.note})` : "")
    ).join("; ");
    put(r, 9, notes, { border: thinBorder(), alignment: { wrapText: true, vertical: "center" }, font: { sz: 10 } });
  });

  const wsWeek = XLSX.utils.aoa_to_sheet(wsWeekAoa);
  Object.entries(styleMap).forEach(([k, style]) => {
    const [r, c] = k.split(",").map(Number);
    const addr = XLSX.utils.encode_cell({ r, c });
    if (!wsWeek[addr]) wsWeek[addr] = { t: "s", v: "" };
    wsWeek[addr].s = style;
  });
  wsWeek["!cols"] = [{ wch: 13 }, { wch: 16 }, ...DAY_NAMES.map(() => ({ wch: 17 })), { wch: 30 }];
  wsWeek["!rows"] = [{ hpt: 30 }, ...employees.map(() => ({ hpt: 34 }))];
  wsWeek["!freeze"] = { xSplit: 1, ySplit: 1 };
  XLSX.utils.book_append_sheet(wb, wsWeek, `Week of ${fmtDate(weekStart)}`.slice(0, 31));

  /* ---------- MONTH sheet (calendar grid) ---------- */
  const empById = Object.fromEntries(employees.map((e) => [e.id, e]));
  const dayStatusKind = (date) => {
    const dow = dowOf(date);
    const dayShifts = shifts.filter((s) => s.date === date);
    if (dayShifts.length === 0) return "empty";
    let missing = 0;
    COVERAGE_TYPES.forEach((type) => {
      const need = settings.days[dow].shifts[type].needed;
      const n = dayShifts.filter((s) => s.type === type).length;
      if (n < need) missing += need - n;
    });
    const issues = dayShifts.reduce((s2, s) => s2 + shiftIssues(s, empById[s.empId]).length, 0);
    return missing > 0 || issues > 0 ? "attention" : "covered";
  };

  const mo = monthOfISO(monthAnchor);
  const gridStart = mondayOf(monthAnchor);
  const mCells = [];
  let d = gridStart;
  while (monthOfISO(d) <= mo || dowOf(d) !== 0) { mCells.push(d); d = addDays(d, 1); if (mCells.length >= 42) break; }
  while (mCells.length > 7 && monthOfISO(mCells[mCells.length - 7]) > mo) mCells.splice(-7);

  const mAoa = [];
  const mStyle = {};
  const mput = (r, c, v, style) => { while (mAoa.length <= r) mAoa.push([]); mAoa[r][c] = v; if (style) mStyle[`${r},${c}`] = style; };
  mput(0, 0, fmtMonth(monthAnchor), { font: { bold: true, sz: 14 } });
  DAY_NAMES.forEach((dn, c) => mput(1, c, dn.toUpperCase(), { fill: headFill, font: headFont, alignment: { horizontal: "center" }, border: thinBorder() }));

  mCells.forEach((date, i) => {
    const row = 2 + Math.floor(i / 7);
    const col = i % 7;
    const inMonth = monthOfISO(date) === mo;
    const kind = inMonth ? dayStatusKind(date) : "empty";
    const dayShifts = shifts.filter((s) => s.date === date).sort((a, b) => a.start - b.start);
    const offs = employees.filter((e) => onTimeOff(e, date)).map((e) => `✕ ${e.name} off`);
    const lines = [String(+date.slice(8, 10))];
    offs.forEach((o) => lines.push(o));
    dayShifts.forEach((s) => {
      const emp = empById[s.empId];
      lines.push(`${emp ? emp.name : "?"} · ${SHIFT_TYPES[s.type].short.toLowerCase()} ${plainTime(s.start)}-${plainTime(s.end)}`);
    });
    const fill = !inMonth ? "F4F5F2" : kind === "covered" ? "E7F2EC" : kind === "attention" ? "F9E9E5" : "FFFFFF";
    mput(row, col, lines.join("\n"), {
      fill: { patternType: "solid", fgColor: { rgb: fill } },
      alignment: { vertical: "top", wrapText: true },
      border: thinBorder(), font: { sz: 9, color: { rgb: inMonth ? "212A26" : "9AA69E" } },
    });
  });
  const wsMonth = XLSX.utils.aoa_to_sheet(mAoa);
  Object.entries(mStyle).forEach(([k, style]) => {
    const [r, c] = k.split(",").map(Number);
    const addr = XLSX.utils.encode_cell({ r, c });
    if (!wsMonth[addr]) wsMonth[addr] = { t: "s", v: "" };
    wsMonth[addr].s = style;
  });
  wsMonth["!cols"] = DAY_NAMES.map(() => ({ wch: 22 }));
  const weekRows = Math.ceil(mCells.length / 7);
  wsMonth["!rows"] = [{ hpt: 22 }, { hpt: 18 }, ...Array.from({ length: weekRows }, () => ({ hpt: 84 }))];
  wsMonth["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 6 } }];
  XLSX.utils.book_append_sheet(wb, wsMonth, fmtMonth(monthAnchor).slice(0, 31));

  XLSX.writeFile(wb, `shift-board_${weekStart}.xlsx`);
}

/* ------------------------------------------------------------------ */
/* Small UI atoms                                                      */
/* ------------------------------------------------------------------ */
const Chip = ({ children, bg, ink, style }) => (
  <span style={{ background: bg, color: ink, borderRadius: 999, padding: "1px 8px", fontSize: 11, fontWeight: 600, whiteSpace: "nowrap", ...style }}>{children}</span>
);
const Btn = ({ children, onClick, kind = "ghost", small, style, title }) => {
  const base = { fontFamily: "inherit", fontSize: small ? 11 : 13, fontWeight: 600, borderRadius: 8, padding: small ? "3px 8px" : "7px 12px", cursor: "pointer", border: `1px solid ${T.line}`, background: "#fff", color: T.ink, ...style };
  if (kind === "primary") { base.background = T.ink; base.color = "#fff"; base.border = `1px solid ${T.ink}`; }
  if (kind === "danger")  { base.background = T.dangerBg; base.color = T.danger; base.border = `1px solid ${T.danger}44`; }
  return <button onClick={onClick} style={base} title={title}>{children}</button>;
};
const TimeSel = ({ value, onChange, style }) => (
  <select value={value} onChange={(e) => onChange(+e.target.value)} style={{ fontSize: 11.5, ...style }}>
    {TIME_OPTIONS.map((m) => <option key={m} value={m}>{fmtTime(m)}</option>)}
  </select>
);

/* ------------------------------------------------------------------ */
/* Main app                                                            */
/* ------------------------------------------------------------------ */
function CafeScheduler() {
  const [employees, setEmployees] = useState(seedEmployees);
  const [shifts, setShifts] = useState(seedShifts);
  const [settings, setSettings] = useState(defaultSettings);
  const [weekStart, setWeekStart] = useState(W);
  const [monthAnchor, setMonthAnchor] = useState("2026-07-01");
  const [tab, setTab] = useState("schedule");
  const [view, setView] = useState("week");
  const [suggestFor, setSuggestFor] = useState(null);
  const [editShift, setEditShift] = useState(null);
  const [dragId, setDragId] = useState(null);
  const [dropHover, setDropHover] = useState(null);

  const weekDates = useMemo(() => Array.from({ length: 7 }, (_, i) => addDays(weekStart, i)), [weekStart]);
  const empById = useMemo(() => Object.fromEntries(employees.map((e) => [e.id, e])), [employees]);
  const colorOf = (empId) => (empById[empId] && empById[empId].color) || "#3F4A55";

  const tmplFor = (dow, type) => settings.days[dow].shifts[type];
  const trainingDefault = (dow) => { const o = settings.days[dow].shifts.open; return { start: o.start, end: o.end }; };
  const templateOrTraining = (dow, type) => (type === "training" ? trainingDefault(dow) : tmplFor(dow, type));

  /* ---- auto-certification from completed training shifts ---- */
  useEffect(() => {
    const grants = {};
    const today = todayISO();
    shifts.forEach((s) => {
      if (s.type !== "training" || s.date > today) return;
      const c = trainingCovers(s, settings);
      if (!grants[s.empId]) grants[s.empId] = { open: false, close: false };
      if (c.open) grants[s.empId].open = true;
      if (c.close) grants[s.empId].close = true;
    });
    let changed = false;
    const next = employees.map((e) => {
      const g = grants[e.id];
      if (!g) return e;
      const patch = {};
      if (g.open && !e.canOpen) patch.canOpen = true;
      if (g.close && !e.canClose) patch.canClose = true;
      if (Object.keys(patch).length) { changed = true; return { ...e, ...patch }; }
      return e;
    });
    if (changed) setEmployees(next);
  }, [shifts, settings]);

  /* ---- day status ---- */
  const dayStatus = (date) => {
    const dow = dowOf(date);
    const dayShifts = shifts.filter((s) => s.date === date);
    if (dayShifts.length === 0) return { kind: "empty", missing: 0, issueCount: 0 };
    let missing = 0;
    COVERAGE_TYPES.forEach((type) => {
      const need = tmplFor(dow, type).needed;
      const n = dayShifts.filter((s) => s.type === type).length;
      if (n < need) missing += need - n;
    });
    const issueCount = dayShifts.reduce((s2, s) => s2 + shiftIssues(s, empById[s.empId]).length, 0);
    if (missing > 0 || issueCount > 0) return { kind: "attention", missing, issueCount };
    return { kind: "covered", missing: 0, issueCount: 0 };
  };

  /* ---- current-week derived ---- */
  const gaps = useMemo(() => {
    const out = [];
    weekDates.forEach((date, dow) => {
      COVERAGE_TYPES.forEach((type) => {
        const need = tmplFor(dow, type).needed;
        const n = shifts.filter((s) => s.date === date && s.type === type).length;
        if (n < need) out.push({ date, type, missing: need - n, dow });
      });
    });
    return out;
  }, [shifts, weekDates, settings]);

  const conflicts = useMemo(() => {
    const out = [];
    shifts.filter((s) => weekDates.includes(s.date)).forEach((s) => {
      shiftIssues(s, empById[s.empId]).forEach((msg) => out.push({ msg, dow: weekDates.indexOf(s.date) }));
    });
    return out;
  }, [shifts, weekDates, empById]);

  const hourRows = useMemo(() =>
    employees.map((e) => {
      const hrs = hoursFor(shifts, e.id, weekDates);
      return { emp: e, hrs, under: hrs < e.minHours - 0.01, over: hrs > e.maxHours + 0.01 };
    }), [employees, shifts, weekDates]);
  const overMax = hourRows.filter((r) => r.over);
  const weekIsEmpty = !shifts.some((s) => weekDates.includes(s.date));

  /* ---- actions ---- */
  const moveShift = (id, date, type) => {
    const dow = dowOf(date);
    setShifts((prev) => prev.map((s) => {
      if (s.id !== id) return s;
      const next = { ...s, date, type };
      if (s.type !== type && type !== "training") { const t = tmplFor(dow, type); next.start = t.start; next.end = t.end; }
      return next; // converting to training keeps existing times (preserves what it shadows)
    }));
  };
  const moveShiftDate = (id, date) => setShifts((prev) => prev.map((s) => (s.id === id ? { ...s, date } : s)));
  const assign = (empId, date, type) => {
    const t = templateOrTraining(dowOf(date), type);
    setShifts((prev) => [...prev, { id: uid(), empId, date, type, start: t.start, end: t.end }]);
    setSuggestFor(null);
  };
  const copyPrevWeek = () => {
    const prevDates = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i - 7));
    const copies = shifts.filter((s) => prevDates.includes(s.date)).map((s) => ({ ...s, id: uid(), date: addDays(s.date, 7) }));
    setShifts((prev) => [...prev, ...copies]);
  };
  const updateEmp = (id, patch) => setEmployees((prev) => prev.map((e) => (e.id === id ? { ...e, ...patch } : e)));
  const updateDay = (dow, patch) => setSettings((prev) => ({ ...prev, days: prev.days.map((d, i) => (i === dow ? { ...d, ...patch } : d)) }));
  const updateDayShift = (dow, type, patch) => setSettings((prev) => ({ ...prev, days: prev.days.map((d, i) => i === dow ? { ...d, shifts: { ...d.shifts, [type]: { ...d.shifts[type], ...patch } } } : d) }));
  const applyStoreHours = (dow) => {
    const d = settings.days[dow];
    const openStart = d.storeOpen - settings.prepMinutes;
    const closeEnd = d.storeClose + d.closeOut;
    setSettings((prev) => ({ ...prev, days: prev.days.map((day, i) => i !== dow ? day : { ...day, shifts: { ...day.shifts, open: { ...day.shifts.open, start: openStart }, close: { ...day.shifts.close, end: closeEnd }, full: { ...day.shifts.full, start: openStart, end: closeEnd } } }) }));
  };

  /* ---- shift card (week view) ---- */
  const renderShiftCard = (s) => {
    const emp = empById[s.empId];
    const st = SHIFT_TYPES[s.type];
    const c = colorOf(s.empId);
    const issues = shiftIssues(s, emp);
    const editing = editShift === s.id;
    const isTraining = s.type === "training";
    return (
      <div key={s.id} draggable
        onDragStart={(e) => { e.dataTransfer.setData("text/plain", s.id); setDragId(s.id); }}
        onDragEnd={() => { setDragId(null); setDropHover(null); }}
        style={{
          background: st.bg, borderLeft: `4px solid ${st.edge}`,
          border: isTraining ? `1px dashed ${st.edge}` : undefined, borderLeftWidth: 4, borderLeftStyle: "solid",
          borderRadius: 8, padding: "6px 8px", marginBottom: 6, cursor: "grab",
          opacity: dragId === s.id ? 0.4 : 1, boxShadow: "0 1px 2px rgba(30,40,35,0.08)",
        }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 6 }}>
          <span style={{ fontWeight: 700, fontSize: 13, color: st.ink, display: "inline-flex", alignItems: "center", gap: 5 }}>
            <span style={{ width: 8, height: 8, borderRadius: 99, background: c, display: "inline-block" }} />
            {emp ? emp.name : "?"}
          </span>
          <span style={{ display: "flex", gap: 4, alignItems: "center" }}>
            {issues.length > 0 && <span title={issues.join(" · ")} style={{ fontSize: 12 }}>⚠️</span>}
            <button onClick={() => setEditShift(editing ? null : s.id)} title="Edit shift" style={{ border: "none", background: "transparent", cursor: "pointer", fontSize: 12, color: st.ink, padding: 0 }}>✎</button>
          </span>
        </div>
        <div style={{ fontSize: 11.5, color: st.ink, opacity: 0.85 }}>
          {fmtTime(s.start)} – {fmtTime(s.end)}
          {isTraining && <span style={{ fontStyle: "italic" }}> · trains {trainingFocusLabel(s, settings)}</span>}
        </div>
        {issues.length > 0 && <div style={{ fontSize: 10.5, color: T.danger, marginTop: 2 }}>{issues[0]}</div>}
        {editing && (
          <div style={{ marginTop: 6, display: "flex", flexWrap: "wrap", gap: 4, alignItems: "center" }}>
            <TimeSel value={s.start} onChange={(v) => setShifts((prev) => prev.map((x) => x.id === s.id ? { ...x, start: v } : x))} />
            <span style={{ fontSize: 11 }}>to</span>
            <TimeSel value={s.end} onChange={(v) => setShifts((prev) => prev.map((x) => x.id === s.id ? { ...x, end: v } : x))} />
            <Btn small kind="danger" onClick={() => { setShifts((prev) => prev.filter((x) => x.id !== s.id)); setEditShift(null); }}>Remove</Btn>
          </div>
        )}
      </div>
    );
  };

  /* ---- week slot (coverage type or training) ---- */
  const renderSlot = (date, type, dow) => {
    const st = SHIFT_TYPES[type];
    const isTraining = type === "training";
    const tmpl = isTraining ? trainingDefault(dow) : tmplFor(dow, type);
    const need = isTraining ? 0 : tmpl.needed;
    const dayShifts = shifts.filter((s) => s.date === date && s.type === type);
    if (!isTraining && need === 0 && dayShifts.length === 0 && !dragId) return null;
    if (isTraining && dayShifts.length === 0 && !dragId) {
      // compact "add training" affordance only
      return (
        <div key={type} style={{ padding: "4px 6px 6px", borderTop: `1px dashed ${T.line}` }}>
          <button onClick={() => setSuggestFor({ date, type })}
            style={{ width: "100%", border: `1px dashed ${st.edge}88`, background: "transparent", color: st.edge, borderRadius: 8, fontSize: 10.5, fontWeight: 700, padding: "4px", cursor: "pointer" }}>
            + training shadow
          </button>
        </div>
      );
    }
    const missing = need - dayShifts.length;
    const hoverKey = `${date}|${type}`;
    return (
      <div key={type}
        onDragOver={(e) => { e.preventDefault(); setDropHover(hoverKey); }}
        onDragLeave={() => setDropHover((h) => (h === hoverKey ? null : h))}
        onDrop={(e) => { e.preventDefault(); const id = e.dataTransfer.getData("text/plain"); if (id) moveShift(id, date, type); setDropHover(null); setDragId(null); }}
        style={{ padding: "6px 6px 2px", borderTop: `1px dashed ${T.line}`, background: dropHover === hoverKey ? `${st.edge}22` : "transparent", transition: "background 120ms", minHeight: 46 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          <span style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: 1, color: st.edge }} title={`${st.label}${isTraining ? " (does not count toward coverage)" : ` · needs ${need}`}`}>{st.short}</span>
          <button onClick={() => setSuggestFor({ date, type })} title={`Add / suggest a ${st.label.toLowerCase()} shift`} style={{ border: "none", background: "transparent", color: st.edge, fontWeight: 800, cursor: "pointer", fontSize: 14, lineHeight: 1, padding: "0 2px" }}>+</button>
        </div>
        {dayShifts.map(renderShiftCard)}
        {missing > 0 && (
          <button onClick={() => setSuggestFor({ date, type })} style={{ width: "100%", border: `1.5px dashed ${T.danger}88`, background: T.dangerBg, color: T.danger, borderRadius: 8, fontSize: 11, fontWeight: 700, padding: "6px 4px", cursor: "pointer", marginBottom: 6 }}>
            Needs {missing} {st.label.toLowerCase()} — suggest
          </button>
        )}
      </div>
    );
  };

  /* ---- suggestion modal ---- */
  const suggestModal = suggestFor && (() => {
    const dow = dowOf(suggestFor.date);
    const st = SHIFT_TYPES[suggestFor.type];
    const tmpl = templateOrTraining(dow, suggestFor.type);
    const wk = Array.from({ length: 7 }, (_, i) => addDays(mondayOf(suggestFor.date), i));
    const { qualified, excluded } = rankCandidates({ employees, shifts, dateISO: suggestFor.date, type: suggestFor.type, weekDates: wk, tmpl, settings });
    return (
      <div onClick={() => setSuggestFor(null)} style={{ position: "fixed", inset: 0, background: "rgba(25,32,28,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }}>
        <div onClick={(e) => e.stopPropagation()} style={{ background: T.panel, borderRadius: 14, padding: 20, width: "min(440px,100%)", maxHeight: "80vh", overflowY: "auto", boxShadow: "0 12px 40px rgba(20,28,24,0.3)" }}>
          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 11, color: T.inkSoft, fontWeight: 700, letterSpacing: 1 }}>SUGGESTIONS</div>
            <div style={{ fontSize: 18, fontWeight: 800 }}>{st.label} · {DAY_NAMES[dow]} {fmtDate(suggestFor.date)}</div>
            <div style={{ fontSize: 12, color: T.inkSoft }}>
              {fmtTime(tmpl.start)}–{fmtTime(tmpl.end)} · {suggestFor.type === "training" ? "ranked to put uncertified staff alongside a trained shift" : "ranked by hours still needed, flexibility, and room under their weekly max"}.
            </div>
          </div>
          {qualified.length === 0 && (
            <div style={{ background: T.dangerBg, color: T.danger, borderRadius: 10, padding: 10, fontSize: 13, fontWeight: 600, marginBottom: 10 }}>
              No one fully qualifies — see who's ruled out below.
            </div>
          )}
          {qualified.map((c, i) => (
            <div key={c.emp.id} style={{ border: `1px solid ${i === 0 ? T.ok : T.line}`, background: i === 0 ? T.okBg : "#fff", borderRadius: 10, padding: "10px 12px", marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
              <div>
                <div style={{ fontWeight: 800, fontSize: 14 }}>{c.emp.name} {i === 0 && <Chip bg={T.ok} ink="#fff" style={{ marginLeft: 4 }}>Best match</Chip>}</div>
                <div style={{ fontSize: 11.5, color: T.inkSoft }}>{c.reasons.join(" · ")}</div>
              </div>
              <Btn kind="primary" small onClick={() => assign(c.emp.id, suggestFor.date, suggestFor.type)}>Assign</Btn>
            </div>
          ))}
          {excluded.length > 0 && (
            <React.Fragment>
              <div style={{ fontSize: 11, fontWeight: 700, color: T.inkSoft, letterSpacing: 1, margin: "12px 0 6px" }}>RULED OUT</div>
              {excluded.map((x) => (
                <div key={x.emp.id} style={{ fontSize: 12.5, color: T.inkSoft, padding: "4px 2px", display: "flex", justifyContent: "space-between", gap: 8 }}>
                  <span style={{ fontWeight: 700 }}>{x.emp.name}</span><span style={{ textAlign: "right" }}>{x.why}</span>
                </div>
              ))}
            </React.Fragment>
          )}
          <div style={{ marginTop: 12, textAlign: "right" }}><Btn onClick={() => setSuggestFor(null)}>Close</Btn></div>
        </div>
      </div>
    );
  })();

  /* ---- month view ---- */
  const monthView = (() => {
    const mo = monthOfISO(monthAnchor);
    const gridStart = mondayOf(monthAnchor);
    const cells = [];
    let d = gridStart;
    while (monthOfISO(d) <= mo || dowOf(d) !== 0) { cells.push(d); d = addDays(d, 1); if (cells.length >= 42) break; }
    while (cells.length > 7 && monthOfISO(cells[cells.length - 7]) > mo) cells.splice(-7);
    const today = todayISO();
    return (
      <div style={{ background: "#fff", border: `1px solid ${T.line}`, borderRadius: 12, overflow: "hidden" }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", borderBottom: `1px solid ${T.line}` }}>
          {DAY_NAMES.map((dn) => <div key={dn} style={{ padding: "8px 10px", fontSize: 11, fontWeight: 800, letterSpacing: 1, color: T.inkSoft, textAlign: "center" }}>{dn.toUpperCase()}</div>)}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)" }}>
          {cells.map((date, idx) => {
            const inMonth = monthOfISO(date) === mo;
            const st = dayStatus(date);
            const dayNum = +date.slice(8, 10);
            const offToday = employees.filter((e) => onTimeOff(e, date));
            const dayShifts = shifts.filter((s) => s.date === date).sort((a, b) => a.start - b.start);
            const maxShown = 3;
            const extra = dayShifts.length - maxShown;
            const hoverKey = `m|${date}`;
            const tint = !inMonth ? "#FAFBF9" : st.kind === "covered" ? "#F3FAF5" : st.kind === "attention" ? "#FDF3F0" : "#fff";
            return (
              <div key={date}
                onDoubleClick={() => { setWeekStart(mondayOf(date)); setView("week"); }}
                onDragOver={(e) => { e.preventDefault(); setDropHover(hoverKey); }}
                onDragLeave={() => setDropHover((h) => (h === hoverKey ? null : h))}
                onDrop={(e) => { e.preventDefault(); const id = e.dataTransfer.getData("text/plain"); if (id) moveShiftDate(id, date); setDropHover(null); setDragId(null); }}
                title="Double-click to open this week"
                style={{ minHeight: 108, padding: "6px 6px 8px", cursor: "pointer", background: dropHover === hoverKey ? "#DCEBE3" : tint, borderRight: (idx % 7) < 6 ? `1px solid ${T.line}` : "none", borderBottom: `1px solid ${T.line}`, opacity: inMonth ? 1 : 0.55 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                  <span style={{ fontSize: 12, fontWeight: 700, width: 22, height: 22, lineHeight: "22px", textAlign: "center", borderRadius: 99, background: date === today ? T.ink : "transparent", color: date === today ? "#fff" : inMonth ? T.ink : T.inkSoft }}>{dayNum}</span>
                  {inMonth && st.kind === "attention" && (
                    <span style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: 0.5, color: T.danger }}>● NEEDS {st.missing || st.issueCount}</span>
                  )}
                </div>
                {offToday.map((e) => (
                  <div key={e.id} style={{ background: T.offBg, color: T.offInk, borderRadius: 4, fontSize: 10.5, fontWeight: 700, padding: "1px 6px", marginBottom: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>✕ {e.name} off</div>
                ))}
                {dayShifts.slice(0, maxShown).map((s) => {
                  const emp = empById[s.empId];
                  const c = colorOf(s.empId);
                  const isTraining = s.type === "training";
                  return (
                    <div key={s.id} draggable
                      onDragStart={(e) => { e.stopPropagation(); e.dataTransfer.setData("text/plain", s.id); setDragId(s.id); }}
                      onDragEnd={() => { setDragId(null); setDropHover(null); }}
                      title={`${emp ? emp.name : "?"} · ${SHIFT_TYPES[s.type].label} ${fmtTime(s.start)}–${fmtTime(s.end)} — drag to move`}
                      style={{ background: isTraining ? "transparent" : c + "22", border: isTraining ? `1px dashed ${c}` : "none", color: c, borderRadius: 4, fontSize: 10.5, fontWeight: 700, padding: "1px 6px", marginBottom: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", cursor: "grab", fontStyle: isTraining ? "italic" : "normal" }}>
                      {fmtTime(s.start)} {emp ? emp.name : "?"} · {SHIFT_TYPES[s.type].short.toLowerCase()}
                    </div>
                  );
                })}
                {extra > 0 && <div style={{ fontSize: 10.5, fontWeight: 700, color: T.inkSoft, padding: "0 6px" }}>+{extra} more</div>}
              </div>
            );
          })}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", padding: "8px 12px", borderTop: `1px solid ${T.line}`, fontSize: 11.5, color: T.inkSoft }}>
          <span><span style={{ background: "#E7F2EC", borderRadius: 3, padding: "0 6px" }}>&nbsp;</span> Covered</span>
          <span><span style={{ background: "#F9E9E5", borderRadius: 3, padding: "0 6px" }}>&nbsp;</span> Needs attention</span>
          <span><span style={{ background: T.offBg, color: T.offInk, borderRadius: 3, padding: "0 4px", fontWeight: 700 }}>✕ off</span> Time off</span>
          <span style={{ fontStyle: "italic" }}>dashed = training</span>
          <span style={{ marginLeft: "auto", display: "flex", gap: 8, flexWrap: "wrap" }}>
            {employees.map((e) => <span key={e.id}><span style={{ color: e.color }}>●</span> {e.name}</span>)}
          </span>
        </div>
      </div>
    );
  })();

  /* ---- week view ---- */
  const weekView = (
    <React.Fragment>
      {(gaps.length > 0 || conflicts.length > 0 || overMax.length > 0) && (
        <div style={{ background: "#fff", border: `1px solid ${T.line}`, borderRadius: 12, padding: "10px 14px", marginBottom: 14 }}>
          <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1, color: T.danger, marginBottom: 6 }}>NEEDS ATTENTION</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {gaps.map((g, i) => (
              <button key={i} onClick={() => setSuggestFor({ date: g.date, type: g.type })} style={{ background: T.dangerBg, color: T.danger, border: `1px solid ${T.danger}33`, borderRadius: 999, fontSize: 12, fontWeight: 700, padding: "3px 10px", cursor: "pointer" }}>
                {DAY_NAMES[g.dow]} needs {g.missing} {SHIFT_TYPES[g.type].label.toLowerCase()} →
              </button>
            ))}
            {overMax.map((r) => <Chip key={r.emp.id} bg={T.warnBg} ink={T.warn}>⚠ {r.emp.name} is over their {r.emp.maxHours}h max ({r.hrs.toFixed(1)}h)</Chip>)}
            {conflicts.map((c, i) => <Chip key={"c" + i} bg={T.warnBg} ink={T.warn}>⚠ {DAY_NAMES[c.dow]}: {c.msg}</Chip>)}
          </div>
        </div>
      )}
      {weekIsEmpty && (
        <div style={{ background: "#fff", border: `1px dashed ${T.line}`, borderRadius: 12, padding: 14, marginBottom: 14, fontSize: 13, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <span>This week is blank. Start from last week's pattern?</span>
          <Btn kind="primary" small onClick={copyPrevWeek}>Copy previous week</Btn>
        </div>
      )}
      <div style={{ overflowX: "auto", paddingBottom: 4 }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7,minmax(150px,1fr))", gap: 8, minWidth: 1080 }}>
          {weekDates.map((date, i) => {
            const offToday = employees.filter((e) => onTimeOff(e, date));
            const d = settings.days[i];
            return (
              <div key={date} style={{ background: T.panel, borderRadius: 12, border: `1px solid ${T.line}`, overflow: "hidden" }}>
                <div style={{ padding: "8px 10px 6px", background: "linear-gradient(90deg,#E9A13B22,#3E7CB122,#6C5CA822)" }}>
                  <div style={{ fontWeight: 800, fontSize: 13 }}>{DAY_NAMES[i]} <span style={{ fontWeight: 500, color: T.inkSoft }}>{fmtDate(date)}</span></div>
                  <div style={{ fontSize: 10.5, color: T.inkSoft }}>Store {fmtTime(d.storeOpen)}–{fmtTime(d.storeClose)}</div>
                  {offToday.length > 0 && <div style={{ marginTop: 4, display: "flex", flexWrap: "wrap", gap: 4 }}>{offToday.map((e) => <Chip key={e.id} bg={T.offBg} ink={T.offInk}>{e.name} off</Chip>)}</div>}
                </div>
                {COVERAGE_TYPES.map((type) => renderSlot(date, type, i))}
                {renderSlot(date, "training", i)}
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 12, padding: 14, marginTop: 14 }}>
        <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1, color: T.inkSoft, marginBottom: 8 }}>WEEKLY HOURS — MINIMUM TO MAXIMUM</div>
        <div style={{ display: "grid", gap: 8 }}>
          {hourRows.map(({ emp, hrs, under, over }) => {
            const pct = Math.min(100, (hrs / Math.max(emp.maxHours, 1)) * 100);
            const minPct = Math.min(100, (emp.minHours / Math.max(emp.maxHours, 1)) * 100);
            return (
              <div key={emp.id} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ width: 70, fontWeight: 700, fontSize: 13 }}>{emp.name}</span>
                <div style={{ flex: 1, height: 10, background: "#EDEFEA", borderRadius: 6, overflow: "hidden", position: "relative" }}>
                  <div style={{ width: `${pct}%`, height: "100%", background: over ? T.warn : under ? T.danger : T.ok, transition: "width 200ms" }} />
                  <div style={{ position: "absolute", left: `${minPct}%`, top: 0, bottom: 0, width: 2, background: T.ink, opacity: 0.5 }} title={`${emp.minHours}h minimum`} />
                </div>
                <span style={{ width: 160, fontSize: 12, textAlign: "right", color: over ? T.warn : under ? T.danger : T.inkSoft, fontWeight: under || over ? 700 : 500 }}>
                  {hrs.toFixed(1)}h ({emp.minHours}–{emp.maxHours}h){over ? " ▲ over max" : under ? " ▼ under min" : " ✓"}
                </span>
              </div>
            );
          })}
        </div>
      </div>
    </React.Fragment>
  );

  /* ---- schedule tab ---- */
  const scheduleTab = (
    <React.Fragment>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center", marginBottom: 12 }}>
        <div style={{ display: "flex", border: `1px solid ${T.line}`, borderRadius: 8, overflow: "hidden" }}>
          {[["week", "Week"], ["month", "Month"]].map(([key, label]) => (
            <button key={key} onClick={() => setView(key)} style={{ border: "none", padding: "5px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", background: view === key ? T.ink : "#fff", color: view === key ? "#fff" : T.ink }}>{label}</button>
          ))}
        </div>
        {view === "week" ? (
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <Btn small onClick={() => setWeekStart(addDays(weekStart, -7))}>←</Btn>
            <span style={{ fontWeight: 800, fontSize: 13 }}>{fmtDate(weekStart)} – {fmtDate(addDays(weekStart, 6))}</span>
            <Btn small onClick={() => setWeekStart(addDays(weekStart, 7))}>→</Btn>
            <Btn small onClick={() => setWeekStart(mondayOf(todayISO()))}>Today</Btn>
          </div>
        ) : (
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <Btn small onClick={() => setMonthAnchor(addMonths(monthAnchor, -1))}>←</Btn>
            <span style={{ fontWeight: 800, fontSize: 13 }}>{fmtMonth(monthAnchor)}</span>
            <Btn small onClick={() => setMonthAnchor(addMonths(monthAnchor, 1))}>→</Btn>
            <Btn small onClick={() => setMonthAnchor(todayISO().slice(0, 7) + "-01")}>Today</Btn>
          </div>
        )}
        <Btn small kind="primary" style={{ marginLeft: "auto" }} title="Downloads an .xlsx with a Week tab and a Month tab — open it in Google Sheets"
          onClick={() => { try { buildWorkbook({ employees, shifts, settings, weekStart, monthAnchor }); } catch (e) { alert("Export failed to load the spreadsheet library. Check your connection and try again."); } }}>
          ⇩ Export to Google Sheets
        </Btn>
      </div>
      {view === "week" ? weekView : monthView}
    </React.Fragment>
  );

  /* ---- team tab ---- */
  const teamTab = (
    <div style={{ display: "grid", gap: 12 }}>
      <div style={{ background: "#fff", border: `1px solid ${T.line}`, borderRadius: 12, padding: 14, fontSize: 12.5, color: T.inkSoft }}>
        These rules drive suggestions and flags: min/max weekly hours, flexibility (3 = very flexible, 1 = stringent), open/close training, day-of-week availability, and time-off requests. Scheduling a completed training shift alongside an opening or closing automatically ticks that person's Can open / Can close.
      </div>
      {employees.map((emp) => (
        <div key={emp.id} style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 12, padding: 14 }}>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 12, alignItems: "center", marginBottom: 10 }}>
            <label title="Calendar color" style={{ display: "inline-flex", width: 20, height: 20, borderRadius: 99, overflow: "hidden", border: `2px solid ${emp.color}`, cursor: "pointer", position: "relative", background: emp.color }}>
              <input type="color" value={emp.color} onChange={(e) => updateEmp(emp.id, { color: e.target.value })} style={{ position: "absolute", inset: -4, width: 30, height: 30, border: "none", padding: 0, cursor: "pointer", opacity: 0 }} />
            </label>
            <input value={emp.name} onChange={(e) => updateEmp(emp.id, { name: e.target.value })} style={{ fontWeight: 800, fontSize: 15, border: "none", borderBottom: `1px dashed ${T.line}`, background: "transparent", width: 110, color: T.ink }} />
            <label style={{ fontSize: 12.5 }}>Min hrs/wk <input type="number" min={0} max={80} value={emp.minHours} onChange={(e) => updateEmp(emp.id, { minHours: +e.target.value || 0 })} style={{ width: 52 }} /></label>
            <label style={{ fontSize: 12.5 }}>Max hrs/wk <input type="number" min={0} max={80} value={emp.maxHours} onChange={(e) => updateEmp(emp.id, { maxHours: +e.target.value || 0 })} style={{ width: 52 }} /></label>
            <label style={{ fontSize: 12.5 }}>Flexibility <select value={emp.flex} onChange={(e) => updateEmp(emp.id, { flex: +e.target.value })}>
              <option value={1}>1 — stringent</option><option value={2}>2 — somewhat</option><option value={3}>3 — flexible</option>
            </select></label>
            <label style={{ fontSize: 12.5, fontWeight: 600 }}><input type="checkbox" checked={emp.canOpen} onChange={(e) => updateEmp(emp.id, { canOpen: e.target.checked })} /> Can open</label>
            <label style={{ fontSize: 12.5, fontWeight: 600 }}><input type="checkbox" checked={emp.canClose} onChange={(e) => updateEmp(emp.id, { canClose: e.target.checked })} /> Can close</label>
            <Btn small kind="danger" style={{ marginLeft: "auto" }} onClick={() => { setEmployees((prev) => prev.filter((e) => e.id !== emp.id)); setShifts((prev) => prev.filter((s) => s.empId !== emp.id)); }}>Remove</Btn>
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
            <span style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft }}>Available:</span>
            {DAY_NAMES.map((d, i) => (
              <button key={d} onClick={() => { const availability = [...emp.availability]; availability[i] = !availability[i]; updateEmp(emp.id, { availability }); }}
                style={{ borderRadius: 999, border: `1px solid ${emp.availability[i] ? T.ok : T.line}`, background: emp.availability[i] ? T.okBg : "#F3F4F1", color: emp.availability[i] ? T.ok : T.inkSoft, fontSize: 11, fontWeight: 700, padding: "2px 9px", cursor: "pointer", textDecoration: emp.availability[i] ? "none" : "line-through" }}>{d}</button>
            ))}
          </div>
          <TimeOffEditor emp={emp} updateEmp={updateEmp} />
        </div>
      ))}
      <Btn kind="primary" onClick={() => setEmployees((prev) => [...prev, { id: uid(), name: "New employee", phone: "", color: DEFAULT_EMP_COLORS[prev.length % DEFAULT_EMP_COLORS.length], minHours: 20, maxHours: 40, flex: 2, canOpen: false, canClose: false, availability: [true,true,true,true,true,true,true], timeOff: [] }])}>+ Add employee</Btn>
    </div>
  );

  /* ---- business settings tab ---- */
  const settingsTab = (
    <div style={{ display: "grid", gap: 12 }}>
      <div style={{ background: "#fff", border: `1px solid ${T.line}`, borderRadius: 12, padding: 14, fontSize: 12.5, color: T.inkSoft, display: "flex", flexWrap: "wrap", gap: 14, alignItems: "center" }}>
        <span>Store hours drive the shift templates. Opening staff arrive early to set up; closing staff stay after to wrap up. Training shifts shadow these and don't count toward coverage.</span>
        <label style={{ fontWeight: 700, color: T.ink }}>Opening prep: <input type="number" min={0} max={120} step={15} value={settings.prepMinutes} onChange={(e) => setSettings((p) => ({ ...p, prepMinutes: +e.target.value || 0 }))} style={{ width: 52 }} /> min before open</label>
      </div>
      {settings.days.map((d, dow) => (
        <div key={dow} style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 12, padding: 14 }}>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 12, alignItems: "center", marginBottom: 10 }}>
            <span style={{ fontWeight: 800, fontSize: 15, width: 92 }}>{DAY_FULL[dow]}</span>
            <label style={{ fontSize: 12.5 }}>Store open <TimeSel value={d.storeOpen} onChange={(v) => updateDay(dow, { storeOpen: v })} /></label>
            <label style={{ fontSize: 12.5 }}>close <TimeSel value={d.storeClose} onChange={(v) => updateDay(dow, { storeClose: v })} /></label>
            <label style={{ fontSize: 12.5 }}>Close-out <input type="number" min={0} max={120} step={15} value={d.closeOut} onChange={(e) => updateDay(dow, { closeOut: +e.target.value || 0 })} style={{ width: 48 }} /> min</label>
            <Btn small onClick={() => applyStoreHours(dow)} title="Recompute opening start and closing end from store hours and buffers">Apply to shifts</Btn>
          </div>
          <div style={{ display: "grid", gap: 6 }}>
            {COVERAGE_TYPES.map((type) => {
              const st = SHIFT_TYPES[type];
              const t = d.shifts[type];
              return (
                <div key={type} style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center", opacity: t.needed === 0 ? 0.55 : 1 }}>
                  <Chip bg={type === "full" ? "#F3E9DA" : st.bg} ink={st.ink} style={{ width: 96, textAlign: "center" }}>{st.label}</Chip>
                  <label style={{ fontSize: 12 }}>Needed <input type="number" min={0} max={6} value={t.needed} onChange={(e) => updateDayShift(dow, type, { needed: +e.target.value || 0 })} style={{ width: 42 }} /></label>
                  <label style={{ fontSize: 12 }}>from <TimeSel value={t.start} onChange={(v) => updateDayShift(dow, type, { start: v })} /></label>
                  <label style={{ fontSize: 12 }}>to <TimeSel value={t.end} onChange={(v) => updateDayShift(dow, type, { end: v })} /></label>
                  <span style={{ fontSize: 11, color: T.inkSoft }}>{((t.end - t.start) / 60).toFixed(1)}h</span>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );

  /* ---- shell ---- */
  return (
    <div style={{ minHeight: "100vh", background: T.bg, color: T.ink, fontFamily: "'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif", padding: 16, boxSizing: "border-box" }}>
      <div style={{ maxWidth: 1240, margin: "0 auto" }}>
        <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 10, marginBottom: 14 }}>
          <div>
            <div style={{ fontSize: 20, fontWeight: 900, letterSpacing: -0.3 }}>Shift Board</div>
            <div style={{ fontSize: 12, color: T.inkSoft }}>Open · Swing · Close · Training — drag shifts to move them</div>
          </div>
          <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
            {[["schedule", "Schedule"], ["team", "Team & rules"], ["settings", "Business settings"]].map(([key, label]) => (
              <Btn key={key} small kind={tab === key ? "primary" : "ghost"} onClick={() => setTab(key)}>{label}</Btn>
            ))}
          </div>
        </div>
        {tab === "schedule" ? scheduleTab : tab === "team" ? teamTab : settingsTab}
      </div>
      {suggestModal}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Time off editor                                                     */
/* ------------------------------------------------------------------ */
function TimeOffEditor({ emp, updateEmp }) {
  const [start, setStart] = useState("");
  const [end, setEnd] = useState("");
  const [note, setNote] = useState("");
  return (
    <div>
      <div style={{ fontSize: 12, fontWeight: 700, color: T.inkSoft, marginBottom: 4 }}>Time-off requests</div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 6 }}>
        {emp.timeOff.length === 0 && <span style={{ fontSize: 12, color: T.inkSoft }}>None</span>}
        {emp.timeOff.map((t) => (
          <span key={t.id} style={{ background: T.offBg, color: T.offInk, borderRadius: 999, fontSize: 11.5, fontWeight: 600, padding: "2px 8px", display: "inline-flex", gap: 6, alignItems: "center" }}>
            {fmtDate(t.start)}{t.end !== t.start ? ` – ${fmtDate(t.end)}` : ""}{t.note ? ` · ${t.note}` : ""}
            <button onClick={() => updateEmp(emp.id, { timeOff: emp.timeOff.filter((x) => x.id !== t.id) })} style={{ border: "none", background: "transparent", color: T.offInk, cursor: "pointer", fontWeight: 800, padding: 0 }}>×</button>
          </span>
        ))}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
        <input type="date" value={start} onChange={(e) => setStart(e.target.value)} style={{ fontSize: 12 }} />
        <span style={{ fontSize: 12 }}>to</span>
        <input type="date" value={end} onChange={(e) => setEnd(e.target.value)} style={{ fontSize: 12 }} />
        <input placeholder="note (optional)" value={note} onChange={(e) => setNote(e.target.value)} style={{ fontSize: 12, width: 120 }} />
        <Btn small onClick={() => { if (!start) return; const e2 = end && end >= start ? end : start; updateEmp(emp.id, { timeOff: [...emp.timeOff, { id: uid(), start, end: e2, note: note.trim() }] }); setStart(""); setEnd(""); setNote(""); }}>Add</Btn>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CafeScheduler />);
</script>
</body>
</html>
